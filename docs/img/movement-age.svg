      <circle cx="46" cy="38" r="4" class="sf-fg"/>
      <path d="M36 128 H56" class="ss ss-line w3"/>
      <path d="M170 54 V92 M150 66 H190 M170 92 V132 M170 92 L192 108 L184 126" class="ss ss-teal w3"/>
