      <rect x="236" y="20" width="112" height="120" rx="6" class="sf-panel ss ss-fg w2"/>
      <text x="246" y="44" class="tx tb">Balance</text>
      <rect x="246" y="50" width="12" height="8" class="sf-line"/><rect x="260" y="50" width="12" height="8" class="sf-line"/><rect x="274" y="50" width="12" height="8" class="sf-teal"/><rect x="288" y="50" width="12" height="8" class="sf-line"/><rect x="302" y="50" width="12" height="8" class="sf-line"/><rect x="316" y="50" width="12" height="8" class="sf-line"/>
      <text x="246" y="84" class="tx tb">Leg strength</text>
      <rect x="246" y="90" width="12" height="8" class="sf-line"/><rect x="260" y="90" width="12" height="8" class="sf-line"/><rect x="274" y="90" width="12" height="8" class="sf-line"/><rect x="288" y="90" width="12" height="8" class="sf-blue"/><rect x="302" y="90" width="12" height="8" class="sf-line"/><rect x="316" y="90" width="12" height="8" class="sf-line"/>
      <text x="246" y="122" class="tm">age band + source</text>
</svg>
