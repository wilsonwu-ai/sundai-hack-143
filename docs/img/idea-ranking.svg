    --amber-ink: #f4b469;
    --amber-soft: #4a3216;
    --blue: #8db4f2;
    --blue-soft: #23375c;
    --pass: #6fd197;
    --pass-bg: #1b4430;
    --pend: #f0cc66;
    --pend-bg: #4a3c10;
    --fail: #f59a93;
    --fail-bg: #4d1f1c;
    --focus: #9ec1ff;
    
  } }
.card { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.sf-panel { fill: var(--panel); }
.sf-panel2 { fill: var(--panel2); }
.sf-teal { fill: var(--teal); }
.sf-tealsoft { fill: var(--teal-soft); }
.sf-amber { fill: var(--amber); }
.sf-ambersoft { fill: var(--amber-soft); }
.sf-blue { fill: var(--blue); }
.sf-bluesoft { fill: var(--blue-soft); }
.sf-fg { fill: var(--fg); }
.sf-line { fill: var(--line); }
.sf-none { fill: none; }
.ss { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ss-fg { stroke: var(--fg); }
.ss-line { stroke: var(--line); }
.ss-teal { stroke: var(--teal); }
.ss-amber { stroke: var(--amber); }
.ss-blue { stroke: var(--blue); }
.ss-muted { stroke: var(--muted); }
.w1 { stroke-width: 1; }
.w2 { stroke-width: 2; }
.w3 { stroke-width: 3; }
.w4 { stroke-width: 4; }
.dash { stroke-dasharray: 4 4; }
.tx { fill: var(--fg); font-family: var(--body); font-size: 13px; }
.tm { fill: var(--muted); font-family: var(--body); font-size: 12px; }
.tb { font-weight: 700; }
.ta { fill: var(--amber-ink); }
.tt { fill: var(--teal); }
.tbg { fill: var(--bg); }
.tbig { font-family: var(--display); font-size: 14px; font-weight: 700; fill: var(--fg); }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.mk { fill: var(--muted); }
]]></style>
