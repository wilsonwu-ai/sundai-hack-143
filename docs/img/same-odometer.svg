<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 392 232" width="784" height="464" role="img" aria-labelledby="age-t">
<style><![CDATA[
svg {
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bg: #eef4f3;
  --panel: #ffffff;
  --panel2: #e1ecea;
  --fg: #112a2e;
  --muted: #4a6468;
  --line: #b9cdcb;
  --teal: #0a6f6a;
  --teal-soft: #cfe8e4;
  --amber: #c2610f;
  --amber-ink: #8f4608;
  --amber-soft: #fbe3c9;
  --blue: #2a5ba8;
  --blue-soft: #d9e4f5;
  --pass: #1c7a3f;
  --pass-bg: #d7efdf;
  --pend: #7d5800;
  --pend-bg: #f8ecc4;
  --fail: #b3261e;
  --fail-bg: #f7d9d6;
  --focus: #1b4fd6;
  
}
@media (prefers-color-scheme: dark) { svg {
    --bg: #0e1c20;
    --panel: #15292e;
    --panel2: #1c353b;
    --fg: #e3efee;
    --muted: #9db8b8;
    --line: #2f4d53;
    --teal: #4fc9bd;
    --teal-soft: #1b4a4a;
    --amber: #f0a64e;
    --amber-ink: #f4b469;
    --amber-soft: #4a3216;
    --blue: #8db4f2;
    --blue-soft: #23375c;
    --pass: #6fd197;
    --pass-bg: #1b4430;
    --pend: #f0cc66;
    --pend-bg: #4a3c10;
    --fail: #f59a93;
    --fail-bg: #4d1f1c;
    --focus: #9ec1ff;
    
  } }
.card { fill: var(--bg); stroke: var(--line); stroke-width: 1; }
.sf-panel { fill: var(--panel); }
.sf-panel2 { fill: var(--panel2); }
.sf-teal { fill: var(--teal); }
.sf-tealsoft { fill: var(--teal-soft); }
.sf-amber { fill: var(--amber); }
.sf-ambersoft { fill: var(--amber-soft); }
.sf-blue { fill: var(--blue); }
.sf-bluesoft { fill: var(--blue-soft); }
.sf-fg { fill: var(--fg); }
.sf-line { fill: var(--line); }
.sf-none { fill: none; }
.ss { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ss-fg { stroke: var(--fg); }
.ss-line { stroke: var(--line); }
.ss-teal { stroke: var(--teal); }
.ss-amber { stroke: var(--amber); }
.ss-blue { stroke: var(--blue); }
.ss-muted { stroke: var(--muted); }
.w1 { stroke-width: 1; }
.w2 { stroke-width: 2; }
.w3 { stroke-width: 3; }
.w4 { stroke-width: 4; }
.dash { stroke-dasharray: 4 4; }
.tx { fill: var(--fg); font-family: var(--body); font-size: 13px; }
.tm { fill: var(--muted); font-family: var(--body); font-size: 12px; }
.tb { font-weight: 700; }
.ta { fill: var(--amber-ink); }
.tt { fill: var(--teal); }
.tbg { fill: var(--bg); }
.tbig { font-family: var(--display); font-size: 14px; font-weight: 700; fill: var(--fg); }
.mid { text-anchor: middle; }
.end { text-anchor: end; }
.mk { fill: var(--muted); }
]]></style>
<rect class="card" x="-15.5" y="-15.5" width="391" height="231" rx="14"/>
<title id="age-t">Two cars with the same odometer and different engine wear</title>
      <desc id="age-d">One odometer is shared by two cars. Car A has a gauge pointing to light wear. Car B has a gauge pointing to heavy wear.</desc>
      <rect x="100" y="8" width="160" height="36" rx="4" class="sf-panel ss ss-fg w2"/>
      <rect x="108" y="14" width="24" height="24" rx="2" class="sf-panel2"/>
      <rect x="138" y="14" width="24" height="24" rx="2" class="sf-panel2"/>
      <rect x="168" y="14" width="24" height="24" rx="2" class="sf-panel2"/>
      <rect x="198" y="14" width="24" height="24" rx="2" class="sf-panel2"/>
      <rect x="228" y="14" width="24" height="24" rx="2" class="sf-panel2"/>
      <text x="180" y="64" class="tx mid tb">Same odometer = same birthday age</text>
      <path d="M34 150 A56 56 0 0 1 146 150" class="ss ss-line w4"/>
      <path d="M90 150 L54 125" class="ss ss-teal w3"/>
      <circle cx="90" cy="150" r="5" class="sf-teal"/>
      <path d="M214 150 A56 56 0 0 1 326 150" class="ss ss-line w4"/>
      <path d="M270 150 L306 125" class="ss ss-amber w3"/>
      <circle cx="270" cy="150" r="5" class="sf-amber"/>
      <text x="90" y="172" class="tbig mid">Car A</text>
      <text x="90" y="190" class="tm mid">light engine wear</text>
      <text x="270" y="172" class="tbig mid">Car B</text>
      <text x="270" y="190" class="tm mid">heavy engine wear</text>
</svg>
